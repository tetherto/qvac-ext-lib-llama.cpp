name: EditorConfig Checker

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# QVAC divergence from upstream: group per PR/branch, not run_id, so pushes and
# dispatches supersede each other too. See QVAC-24627.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  editorconfig:
    needs: runner_names
    runs-on: ${{ needs.runner_names.outputs.qvac_ubuntu2404_x64 }}
    steps:
      - uses: actions/checkout@v6
      - uses: editorconfig-checker/action-editorconfig-checker@840e866d93b8e032123c23bac69dece044d4d84c # v2.2.0
        with:
          version: v3.0.3
      - run: editorconfig-checker
