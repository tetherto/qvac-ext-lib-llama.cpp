name: Build relocatable cmake package
on:
  workflow_dispatch:
  workflow_call:

jobs:
  linux:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        run: |
          PREFIX="$(pwd)"/inst
          cmake -S . -B build \
                -DCMAKE_PREFIX_PATH="$PREFIX" \
                -DLLAMA_OPENSSL=OFF \
                -DLLAMA_BUILD_TESTS=OFF \
                -DLLAMA_BUILD_TOOLS=OFF \
                -DLLAMA_BUILD_EXAMPLES=OFF \
                -DLLAMA_BUILD_APP=OFF \
                -DLLAMA_BUILD_IS_DEV=OFF \
                -DGGML_VECTOR_INDEX=ON \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j $(nproc)
          cmake --install build --prefix "$PREFIX" --config Release

          mkdir -p vector-index-cmake-pkg
          cat > vector-index-cmake-pkg/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(vector_index_consumer C CXX)
          find_package(ggml CONFIG REQUIRED)
          add_executable(vector_index_consumer main.c)
          target_link_libraries(vector_index_consumer PRIVATE ggml::ggml-vector-index)
          EOF
          cat > vector-index-cmake-pkg/main.c <<'EOF'
          #include "ggml-vector-index.h"

          int main(void) {
              ggml_vec_index_t * idx = ggml_vec_index_create(2, 32);
              if (idx == 0) {
                  return 1;
              }
              ggml_vec_index_free(idx);
              return 0;
          }
          EOF
          cmake -S vector-index-cmake-pkg -B vector-index-cmake-pkg/build -DCMAKE_PREFIX_PATH="$PREFIX"/share
          cmake --build vector-index-cmake-pkg/build
          ./vector-index-cmake-pkg/build/vector_index_consumer

          GGML_PREFIX="$(pwd)"/inst-ggml
          cmake -S ggml -B build-ggml \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$GGML_PREFIX" \
                -DBUILD_SHARED_LIBS=OFF \
                -DGGML_BUILD_TESTS=OFF \
                -DGGML_BUILD_EXAMPLES=OFF \
                -DGGML_VECTOR_INDEX=ON
          cmake --build build-ggml --config Release
          cmake --install build-ggml --config Release
          export PKG_CONFIG_PATH="$GGML_PREFIX"/lib/pkgconfig
          cc vector-index-cmake-pkg/main.c \
             $(pkg-config --cflags --libs --static ggml-vector-index) \
             -o vector-index-pkg-config
          ./vector-index-pkg-config

          export LLAMA_CONFIG="$PREFIX"/share/llama/llama-config.cmake
          build_commit=$(git rev-parse --short HEAD | xargs)
          build_number=$(git rev-list --count HEAD | xargs)

          major=$(grep -oE "set\(LLAMA_VERSION_MAJOR[[:space:]]+[0-9]+" CMakeLists.txt | grep -oE "[0-9]+$")
          minor=$(grep -oE "set\(LLAMA_VERSION_MINOR[[:space:]]+[0-9]+" CMakeLists.txt | grep -oE "[0-9]+$")
          patch=$(grep -oE "set\(LLAMA_VERSION_PATCH[[:space:]]+[0-9]+" CMakeLists.txt | grep -oE "[0-9]+$")
          build_version="$major.$minor.$patch"

          checks=("set\(LLAMA_VERSION[[:space:]]+$build_version\)"
                  "set\(LLAMA_BUILD_COMMIT[[:space:]]+$build_commit\)"
                  "set\(LLAMA_BUILD_NUMBER[[:space:]]+$build_number\)")

          for check in "${checks[@]}"; do
              if ! grep -qE "$check" "$LLAMA_CONFIG"; then
                  echo "Checking llama-config.cmake version... \"$check\" failed!"
                  exit 1
              fi
          done

          echo "Checking llama-config.cmake version... success."

          cd examples/simple-cmake-pkg
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$PREFIX"/share
          cmake --build build -j $(nproc)
