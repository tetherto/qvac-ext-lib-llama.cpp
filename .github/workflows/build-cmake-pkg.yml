name: Build relocatable cmake package
on:
  workflow_dispatch:
  workflow_call:

jobs:
  linux:
    runs-on: [self-hosted, Linux, CPU]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        run: |
          PREFIX="$(pwd)"/inst
          cmake -S . -B build \
                -DCMAKE_PREFIX_PATH="$PREFIX" \
                -DLLAMA_OPENSSL=OFF \
                -DLLAMA_BUILD_TESTS=OFF \
                -DLLAMA_BUILD_TOOLS=OFF \
                -DLLAMA_BUILD_EXAMPLES=OFF \
                -DLLAMA_BUILD_APP=OFF \
                -DGGML_VECTOR_INDEX=ON \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          cmake --install build --prefix "$PREFIX" --config Release

          PREFIX="$PREFIX" \
            CONSUMER_DIR=vector-index-cmake-pkg \
            RUN_PKG_CONFIG=0 \
            bash scripts/vector-index-package-smoke.sh

          GGML_PREFIX="$(pwd)"/inst-ggml
          cmake -S ggml -B build-ggml \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$GGML_PREFIX" \
                -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-gnu \
                -DBUILD_SHARED_LIBS=OFF \
                -DGGML_BUILD_TESTS=OFF \
                -DGGML_BUILD_EXAMPLES=OFF \
                -DGGML_VECTOR_INDEX=ON
          cmake --build build-ggml --config Release
          cmake --install build-ggml --config Release
          PREFIX="$GGML_PREFIX" \
            CONSUMER_DIR=vector-index-pkg-config \
            LIBDIR=lib/x86_64-linux-gnu \
            RUN_CMAKE=0 \
            PKG_CONFIG_STATIC=1 \
            bash scripts/vector-index-package-smoke.sh

          export LLAMA_CONFIG="$PREFIX"/share/llama/llama-config.cmake
          tclsh <<'EOF'
          set build(commit)  [string trim [exec git rev-parse --short HEAD]]
          set build(number)  [string trim [exec git rev-list  --count HEAD]]
          set build(version) "0.0.$build(number)"

          set llamaconfig [read [open "$env(LLAMA_CONFIG)" r]]
          set checks [list "set\\(LLAMA_VERSION     \\s+$build(version)\\)" \
                           "set\\(LLAMA_BUILD_COMMIT\\s+$build(commit)\\)" \
                           "set\\(LLAMA_BUILD_NUMBER\\s+$build(number)\\)"]

          puts -nonewline "Checking llama-config.cmake version... "
          foreach check $checks {
              if {![regexp -expanded -- $check $llamaconfig]} {
                  puts "\"$check\" failed!"
                  exit 1
              }
          }
          puts "success."
          EOF

          cd examples/simple-cmake-pkg
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$PREFIX"/share
          cmake --build build
