name: Python check requirements.txt

on:
  push:
    paths:
      - '.github/workflows/python-check-requirements.yml'
      - 'scripts/check-requirements.sh'
      - 'convert*.py'
      - '**/requirements*.txt'
  pull_request:
    paths:
      - '.github/workflows/python-check-requirements.yml'
      - 'scripts/check-requirements.sh'
      - 'convert*.py'
      - '**/requirements*.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python-check-requirements:
    runs-on: qvac-ubuntu2404-x64
    name: check-requirements
    steps:
      - name: Check out source repository
        uses: actions/checkout@v6
      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # QVAC-23796: scripts/check-requirements.sh shells out to shellcheck. The
      # GitHub-hosted images ship it; the qvac runners do not, and there is no
      # passwordless sudo to apt-get it. Drop the static binary into RUNNER_TEMP
      # instead, which needs no elevation.
      - name: Install shellcheck
        if: runner.environment != 'github-hosted'
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck already present: $(command -v shellcheck)"
            exit 0
          fi
          ver=v0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.linux.x86_64.tar.xz" \
            | tar -xJf - -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-${ver}" >> "$GITHUB_PATH"
      - name: Run check-requirements.sh script
        run:  bash scripts/check-requirements.sh
