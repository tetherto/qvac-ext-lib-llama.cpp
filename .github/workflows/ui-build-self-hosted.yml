name: UI Build (self-hosted)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # QVAC-23796: was [self-hosted, fast], an upstream label no runner in this
    # org carries, so this queued for 24h and then failed. Reached on PRs
    # indirectly, via ui-self-hosted.yml calling this reusable workflow.
    # Pure Node build - setup-node provides its own toolchain and nothing here
    # needs sudo, so the plain Ubuntu box is sufficient.
    runs-on: qvac-ubuntu2404-x64
    timeout-minutes: 20
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: tools/ui

      - name: Build application
        run: npm run build
        working-directory: tools/ui

      - name: Upload built UI
        uses: actions/upload-artifact@v6
        with:
          name: ui-build
          path: tools/ui/dist/
          retention-days: 1
