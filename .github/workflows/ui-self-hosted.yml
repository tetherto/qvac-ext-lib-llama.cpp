name: UI (self-hosted)

# these are the same as ui.yml, but with self-hosted runners
#
# the qvac runners carry Playwright's OS libraries but no browsers and no
# shared /ms-playwright, so each job installs Chromium itself. `npx playwright`
# resolves the @playwright/test that `npm ci` just installed, which keeps the
# browser build matched to tools/ui/package.json without pinning a version here.
# Chromium only: playwright.config.ts defines a single chromium project, and the
# vitest browser projects pin chromium too.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA1 to build'
        required: false
        type: string
  push:
    branches:
      - master
    paths: [
      '.github/workflows/ui-self-hosted.yml',
      '.github/workflows/ui-build-self-hosted.yml',
      'tools/ui/**.*',
      'tools/server/tests/**.*'
    ]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/ui-self-hosted.yml',
      '.github/workflows/ui-build-self-hosted.yml',
      'tools/ui/**.*',
      'tools/server/tests/**.*'
    ]

env:
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1
  LLAMA_ARG_LOG_VERBOSITY: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  ui-build:
    name: Build static output
    uses: ./.github/workflows/ui-build-self-hosted.yml

  ui-checks:
    name: Checks
    needs: [ui-build, runner_names]
    runs-on: ${{ needs.runner_names.outputs.qvac_ubuntu2404_x64 }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha || github.head_ref || github.ref_name }}

      - name: Install dependencies
        id: setup
        run: npm ci
        working-directory: tools/ui

      - name: Install Playwright browser
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npx playwright install chromium
        working-directory: tools/ui

      - name: Download built UI artifacts
        uses: actions/download-artifact@v6
        with:
          name: ui-build
          path: tools/ui/dist/

      - name: Run type checking
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npm run check
        working-directory: tools/ui

      - name: Run linting
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npm run lint
        working-directory: tools/ui

      - name: Run Client tests
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npm run test:client
        working-directory: tools/ui

      - name: Run Unit tests
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npm run test:unit
        working-directory: tools/ui

  e2e-tests:
    name: E2E Tests
    needs: [ui-build, runner_names]
    runs-on: ${{ needs.runner_names.outputs.qvac_ubuntu2404_x64 }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha || github.head_ref || github.ref_name }}

      - name: Install dependencies
        id: setup
        run: npm ci
        working-directory: tools/ui

      - name: Install Playwright browser
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npx playwright install chromium
        working-directory: tools/ui

      - name: Download built UI artifacts
        uses: actions/download-artifact@v6
        with:
          name: ui-build
          path: tools/ui/dist/

      - name: Build Storybook
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npm run build-storybook
        working-directory: tools/ui

      - name: Run UI tests
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npm run test:ui -- --testTimeout=60000
        working-directory: tools/ui

      - name: Run E2E tests
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npm run test:e2e
        working-directory: tools/ui
